name: Scanner tests

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "scanner.py"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scanner.py"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout tested branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scanner
        run: python -m py_compile scanner.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
