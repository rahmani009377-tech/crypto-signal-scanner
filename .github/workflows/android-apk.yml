# Build trigger: verify the Android APK workflow runs on main.
name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check scanner source imports
        run: |
          grep -q '^import java.util.Locale$' app/src/main/java/com/rahmani/cryptoscanner/ScannerEngine.kt
          echo "Locale import check passed."

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: rahmani-crypto-scanner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
