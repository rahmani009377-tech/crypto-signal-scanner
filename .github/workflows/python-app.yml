name: Binance Signal Scanner

on:
  push:
    branches:
      - main
    paths:
      - "scanner.py"
      - "tests/**"
      - ".github/workflows/python-app.yml"
  schedule:
    # GitHub schedule has been delayed; use a realistic 30-minute cadence.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-signal-scanner-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run scanner
        run: python scanner.py

      - name: Save fresh signals
        run: |
          cp signals.json /tmp/signals.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/signals.json signals.json
            git add signals.json

            if git diff --cached --quiet; then
              echo "signals.json is unchanged; nothing to commit."
              exit 0
            fi

            git commit -m "Update market signals"
            if git push origin HEAD:main; then
              echo "Signals published successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying from latest main."
          done

          echo "Could not publish signals after 3 attempts."
          exit 1
